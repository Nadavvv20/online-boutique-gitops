{{- if .Values.inventoryService.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.inventoryService.name }}
  namespace: {{.Release.Namespace}}
  {{- if and .Values.inventoryService.serviceAccount .Values.inventoryService.serviceAccount.annotations }}
  annotations:
    {{- toYaml .Values.inventoryService.serviceAccount.annotations | nindent 4 }}
  {{- else if not .Values.serviceAccounts.annotationsOnlyForCartservice }}
  {{- with .Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.inventoryService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.inventoryService.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.inventoryService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.inventoryService.name }}
    spec:
      {{- if .Values.serviceAccounts.create }}
      serviceAccountName: {{ .Values.inventoryService.name }}
      {{- else }}
      serviceAccountName: default
      {{- end }}
      terminationGracePeriodSeconds: 5
      {{- if .Values.securityContext.enable }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        {{- if .Values.seccompProfile.enable }}
        seccompProfile:
          type: {{ .Values.seccompProfile.type }}
        {{- end }}
      {{- end }}
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: {{ dig "image" "repository" .Values.images.repository .Values.inventoryService }}/{{ .Values.inventoryService.name }}:{{ dig "image" "tag" (.Values.images.tag | default .Chart.AppVersion) .Values.inventoryService }}
        ports:
        - containerPort: 7070
        env:
        - name: PORT
          value: "7070"
        - name: REDIS_ADDR
          value: {{ .Values.cartDatabase.connectionString | quote }}
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: aurora-credentials
              key: DB_HOST
              optional: true
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: aurora-credentials
              key: DB_PORT
              optional: true
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: aurora-credentials
              key: DB_NAME
              optional: true
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: aurora-credentials
              key: DB_USER
              optional: true
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aurora-credentials
              key: DB_PASSWORD
              optional: true
        readinessProbe:
          grpc:
            port: 7070
        livenessProbe:
          grpc:
            port: 7070
        resources:
          {{- toYaml .Values.inventoryService.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.inventoryService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.inventoryService.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.inventoryService.name }}
  ports:
  - name: grpc
    port: 7070
    targetPort: 7070
{{- end }}
